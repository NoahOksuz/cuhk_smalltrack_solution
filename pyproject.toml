[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samhar"
version = "1.0.0"
description = "CUHK-X Small Model Track inference package"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch==2.14.0",
  "torchvision==0.29.0",
  "numpy==2.5.2",
  "scipy==1.18.1",
  "pillow==12.3.0",
  "ultralytics==8.4.142",
  "pi-heif==1.4.0",
]

[project.scripts]
samhar = "cuhk_infer.cli:main"
cuhk-infer = "cuhk_infer.cli:main"

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = [
  "sota_aligned_repeats",
  "sota_blocks",
  "sota_context_prior",
  "sota_data",
  "sota_data_res",
  "sota_data_zoom",
  "sota_decoder",
  "sota_decoder_guard",
  "sota_delta_pack",
  "sota_ensemble",
  "sota_group_relax",
  "sota_joint",
  "sota_marginal_decode",
  "sota_model",
  "sota_pack2",
  "sota_release_infer2",
  "sota_structure",
  "sota_thermal32",
  "sota_views",
]

[tool.setuptools.packages.find]
where = ["code"]
include = ["cuhk_infer*"]
